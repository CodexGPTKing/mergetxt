<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TXT Merger • 300+ Files • iPhone Safari</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        :root { --bg: #f8f9fa; --text: #111; --accent: #0066ff; }
        @media (prefers-color-scheme: dark) { :root { --bg: #111; --text: #f8f9fa; --accent: #4da3ff; } }
        body { margin:0; padding:20px; font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
        .container { max-width:640px; margin:40px auto; background:white; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,0.1); padding:30px; }
        @media (prefers-color-scheme: dark) { .container { background:#222; } }
        h1 { font-size:28px; margin:0 0 10px; text-align:center; }
        p { text-align:center; color:#666; margin:0 0 30px; font-size:15px; }
        .btn { display:block; width:100%; padding:16px; font-size:18px; font-weight:600; border-radius:12px; text-align:center; text-decoration:none; margin-bottom:15px; }
        .select-btn { background:var(--accent); color:white; }
        .merge-btn { background:#28a745; color:white; opacity:0.5; pointer-events:none; }
        .merge-btn.enabled { opacity:1; pointer-events:auto; }
        .status { text-align:center; margin:20px 0; font-size:15px; min-height:24px; }
        .progress-container { height:8px; background:#eee; border-radius:9999px; overflow:hidden; margin:20px 0; }
        .progress-bar { height:100%; width:0%; background:var(--accent); transition:width 0.3s ease; }
        .download-link { display:none; }
        .info { font-size:13px; color:#666; text-align:center; margin-top:30px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📂 TXT Merger</h1>
        <p>300+ files • Auto-sorts alphabetically by filename • Smart encoding support • 100% local in Safari</p>
        
        <a href="#" id="selectBtn" class="btn select-btn">Select Text-Based Files</a>
        <input type="file" id="fileInput" multiple accept=".txt,.text,.log,.csv,.tsv,.md,.markdown,.json,.jsonl,.xml,.yaml,.yml,.ini,.cfg,.conf,.properties,.sql,.js,.ts,.css,.scss,.py,.java,.c,.cpp,.h,.hpp,.rb,.go,.rs,.php,.sh,.bat,.ps1,.rtf,.srt,.vtt,.htm,.html,.xhtml,.svg,.eml,text/plain,text/html,text/*,application/xhtml+xml,application/xml,application/json" style="display:none;">
        
        <div id="status" class="status">No files selected yet</div>
        
        <div class="progress-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>
        
        <a href="#" id="mergeBtn" class="btn merge-btn">Merge & Download TXT</a>
        
        <div id="result" class="info"></div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const selectBtn = document.getElementById('selectBtn');
        const mergeBtn = document.getElementById('mergeBtn');
        const statusEl = document.getElementById('status');
        const progressBar = document.getElementById('progressBar');
        const resultEl = document.getElementById('result');
        
        let selectedFiles = [];
        
        // Trigger hidden input
        selectBtn.addEventListener('click', (e) => {
            e.preventDefault();
            fileInput.click();
        });
        
        // Handle file selection + instant alpha sort
        fileInput.addEventListener('change', (e) => {
            selectedFiles = Array.from(e.target.files);
            // Critical: alphabetical sort by filename
            selectedFiles.sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));
            
            if (selectedFiles.length > 0) {
                statusEl.textContent = `${selectedFiles.length} files selected & sorted alphabetically`;
                mergeBtn.classList.add('enabled');
                mergeBtn.textContent = `Merge ${selectedFiles.length} Files → Download`;
            } else {
                statusEl.textContent = 'No files selected';
                mergeBtn.classList.remove('enabled');
            }
            progressBar.style.width = '0%';
            resultEl.textContent = '';
        });
        
        const decoderCandidates = [
            'utf-8',
            'utf-16le',
            'utf-16be',
            'windows-1255', // Hebrew (common in old Windows exports)
            'iso-8859-8',   // Hebrew legacy visual
            'iso-8859-8-i', // Hebrew logical
            'windows-1256', // Arabic
            'windows-1251', // Cyrillic
            'windows-1250', // Central European
            'windows-1254', // Turkish
            'windows-1253', // Greek
            'shift_jis',
            'euc-jp',
            'gb18030',
            'big5',
            'euc-kr',
            'windows-874',
            'windows-1252', // Western ANSI
            'iso-8859-1'
        ];
        const textTypeAllowList = ['text/', 'application/xml', 'application/xhtml+xml', 'application/json'];

        function detectBomEncoding(bytes) {
            if (bytes.length >= 3 && bytes[0] === 0xef && bytes[1] === 0xbb && bytes[2] === 0xbf) return 'utf-8';
            if (bytes.length >= 2 && bytes[0] === 0xff && bytes[1] === 0xfe) return 'utf-16le';
            if (bytes.length >= 2 && bytes[0] === 0xfe && bytes[1] === 0xff) return 'utf-16be';
            return null;
        }

        function detectUtf16ByNullPattern(bytes) {
            if (bytes.length < 8) return null;

            const sampleLength = Math.min(bytes.length, 2048);
            let evenNull = 0;
            let oddNull = 0;
            let inspectedPairs = 0;
            for (let i = 0; i + 1 < sampleLength; i += 2) {
                if (bytes[i] === 0x00) evenNull++;
                if (bytes[i + 1] === 0x00) oddNull++;
                inspectedPairs++;
            }

            if (inspectedPairs < 8) return null;
            const evenRatio = evenNull / inspectedPairs;
            const oddRatio = oddNull / inspectedPairs;

            if (oddRatio > 0.35 && evenRatio < 0.1) return 'utf-16le';
            if (evenRatio > 0.35 && oddRatio < 0.1) return 'utf-16be';
            return null;
        }

        function maybeExtractDeclaredCharset(bytes) {
            try {
                const asciiHead = new TextDecoder('latin1', { fatal: false }).decode(bytes.slice(0, 4096)).toLowerCase();
                const metaMatch = asciiHead.match(/charset\s*=\s*["']?\s*([a-z0-9._-]+)/i);
                if (metaMatch && metaMatch[1]) {
                    return metaMatch[1].trim();
                }
            } catch (error) {
                // No-op; continue with heuristic detection.
            }
            return null;
        }

        function scoreDecodedText(text, bytes) {
            if (!text || text.length === 0) return Number.POSITIVE_INFINITY;

            let replacementCount = 0;
            let nullCount = 0;
            let controlCount = 0;
            let hebrewCount = 0;
            let latinCount = 0;
            let cjkCount = 0;
            let punctuationCount = 0;
            let mojibakeHints = 0;

            for (let i = 0; i < text.length; i++) {
                const code = text.charCodeAt(i);
                if (code === 0xfffd) replacementCount++;
                if (code === 0x0000) nullCount++;
                if (code < 32 && code !== 9 && code !== 10 && code !== 13) controlCount++;
                if (code >= 0x0590 && code <= 0x05ff) hebrewCount++;
                else if ((code >= 0x0041 && code <= 0x007a) || (code >= 0x00c0 && code <= 0x024f)) latinCount++;
                else if ((code >= 0x4e00 && code <= 0x9fff) || (code >= 0x3040 && code <= 0x30ff) || (code >= 0xac00 && code <= 0xd7af)) cjkCount++;
                else if ((code >= 33 && code <= 47) || (code >= 58 && code <= 64) || (code >= 91 && code <= 96) || (code >= 123 && code <= 126)) punctuationCount++;
            }

            if (/[ÃÐÑØÙœ¢£¤¥¦§¨©ª«¬®¯°±²³´µ¶·¸¹º»¼½¾¿]/.test(text)) mojibakeHints += 8;
            if (/ðŸ/.test(text)) mojibakeHints += 8;

            const density = text.length > 0 ? punctuationCount / text.length : 0;
            const scriptSignal = Math.max(hebrewCount, latinCount, cjkCount);
            const weakScriptPenalty = scriptSignal < 5 ? 3 : 0;
            const punctuationPenalty = density > 0.45 ? 8 : 0;
            const binaryPenalty = bytes.length > 0 && text.length > bytes.length * 1.8 ? 6 : 0;

            return (replacementCount * 14) + (nullCount * 5) + (controlCount * 2) + weakScriptPenalty + punctuationPenalty + mojibakeHints + binaryPenalty;
        }

        function isLikelyBinary(bytes) {
            if (!bytes || bytes.length === 0) return false;
            const sampleLength = Math.min(bytes.length, 8192);
            let suspicious = 0;

            for (let i = 0; i < sampleLength; i++) {
                const b = bytes[i];
                if (b === 0) suspicious += 2;
                else if ((b < 7 || (b > 13 && b < 32)) && b !== 9 && b !== 10 && b !== 13) suspicious++;
            }

            return (suspicious / sampleLength) > 0.25;
        }

        function decodeBytesWithBestEncoding(arrayBuffer) {
            const bytes = new Uint8Array(arrayBuffer);
            const bomEncoding = detectBomEncoding(bytes);
            const inferredUtf16 = detectUtf16ByNullPattern(bytes);
            const declaredCharset = maybeExtractDeclaredCharset(bytes);

            if (bomEncoding) {
                return {
                    text: new TextDecoder(bomEncoding, { fatal: false }).decode(bytes),
                    encoding: bomEncoding
                };
            }

            if (inferredUtf16) {
                return {
                    text: new TextDecoder(inferredUtf16, { fatal: false }).decode(bytes),
                    encoding: `${inferredUtf16} (no BOM)`
                };
            }

            if (declaredCharset) {
                try {
                    const decoded = new TextDecoder(declaredCharset, { fatal: false }).decode(bytes);
                    return { text: decoded, encoding: `${declaredCharset} (declared)` };
                } catch (error) {
                    // Unsupported label in this browser; continue with candidates.
                }
            }

            let best = null;
            for (const encoding of decoderCandidates) {
                try {
                    const decoded = new TextDecoder(encoding, { fatal: false }).decode(bytes);
                    const score = scoreDecodedText(decoded, bytes);
                    if (!best || score < best.score) {
                        best = { text: decoded, encoding, score };
                        if (score === 0) break;
                    }
                } catch (error) {
                    // Ignore unsupported decoder labels in older browsers
                }
            }

            if (best) {
                return { text: best.text, encoding: best.encoding };
            }

            return {
                text: new TextDecoder('utf-8', { fatal: false }).decode(bytes),
                encoding: 'utf-8'
            };
        }

        async function readFileAsTextWithFallback(file) {
            const arrayBuffer = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = reject;
                reader.readAsArrayBuffer(file);
            });

            const bytes = new Uint8Array(arrayBuffer);
            const mimeType = (file.type || '').toLowerCase();
            const hasAllowedMime = textTypeAllowList.some((allowedType) => mimeType.startsWith(allowedType));

            if (isLikelyBinary(bytes) && !hasAllowedMime) {
                return {
                    text: `[Skipped: ${file.name} appears to be binary / non-text content]`,
                    encoding: 'skipped-binary'
                };
            }

            return decodeBytesWithBestEncoding(arrayBuffer);
        }

        // Merge function – sequential read for memory safety on mobile
        async function mergeFiles() {
            if (selectedFiles.length === 0) return;
            
            statusEl.textContent = 'Reading files... (this may take a moment on iPhone)';
            progressBar.style.width = '0%';
            resultEl.textContent = '';
            
            const mergedParts = [];
            let processed = 0;
            const encodingUsage = new Map();
            let skippedCount = 0;
            
            for (const file of selectedFiles) {
                try {
                    const { text: content, encoding } = await readFileAsTextWithFallback(file);
                    encodingUsage.set(encoding, (encodingUsage.get(encoding) || 0) + 1);
                    if (encoding === 'skipped-binary') skippedCount++;
                    
                    // Add clear separator with filename (makes merged file usable)
                    mergedParts.push(`=== ${file.name} ===\n${content}\n\n`);
                } catch (error) {
                    mergedParts.push(`=== ${file.name} ===\n[Read failed: ${error?.message || 'unknown error'}]\n\n`);
                    encodingUsage.set('failed-read', (encodingUsage.get('failed-read') || 0) + 1);
                }
                
                processed++;
                const percent = Math.round((processed / selectedFiles.length) * 100);
                progressBar.style.width = `${percent}%`;
                statusEl.textContent = `Processed ${processed}/${selectedFiles.length} files...`;
            }

            const mergedContent = mergedParts.join('');
            
            // Create downloadable TXT Blob
            const blob = new Blob([mergedContent], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `merged_${new Date().toISOString().slice(0,10)}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            // Final success
            statusEl.textContent = `✅ Success! ${selectedFiles.length} files merged & downloaded`;
            progressBar.style.width = '100%';
            const encodingSummary = Array.from(encodingUsage.entries())
                .sort((a, b) => b[1] - a[1])
                .map(([encoding, count]) => `${encoding} (${count})`)
                .join(', ');
            const skippedSummary = skippedCount > 0 ? `<br><strong>Skipped binary files:</strong> ${skippedCount}` : '';
            resultEl.innerHTML = `File saved as <strong>merged_YYYY-MM-DD.txt</strong><br>Contains all files with clear filename separators.<br>Detected encodings: ${encodingSummary}.${skippedSummary}`;
            mergeBtn.textContent = 'Done ✓ (select new files to repeat)';
        }
        
        // Wire up merge button
        mergeBtn.addEventListener('click', (e) => {
            e.preventDefault();
            if (mergeBtn.classList.contains('enabled')) {
                mergeFiles();
            }
        });
        
        // Keyboard hint for power users
        console.log('%c✅ TXT Merger ready for 300+ files on iPhone Safari. Auto-sorts by filename.', 'color:#0066ff;font-weight:600');
    </script>
</body>
</html>
